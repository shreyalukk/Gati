version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: gati-db
    environment:
      POSTGRES_DB: gati
      POSTGRES_USER: gati_user
      POSTGRES_PASSWORD: gati_password
    ports:
      - "5432:5432"
    volumes:
      - gati_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gati_user -d gati"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gati_pgdata:
